{% extends 'base.html' %}
{% block title %}{{ code }} · Request could not be completed{% endblock %}
{% block content %}<section class="empty-state"><p class="eyebrow">ERROR {{ code }}</p><h1>We couldn't complete that request.</h1><p>{{ message }}</p><div class="actions"><a class="button" href="{{ url_for('public.home') }}">Back to home</a>{% if code == 403 and not current_user.is_authenticated %}<a class="button secondary" href="{{ url_for('auth.login') }}">Admin login</a>{% endif %}</div></section>{% endblock %}
